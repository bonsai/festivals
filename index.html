<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>festivals — 祭り・フェス</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#13171c;--line:#252b33;--text:#f2f4f7;--muted:#8d98a5;--accent:#9bd4ff}
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1180px;margin:0 auto;padding:24px;background:var(--bg);color:var(--text);line-height:1.55}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}h1{font-size:32px;margin:0}.meta{color:var(--muted);margin:.25rem 0 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
#status{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:9px}.card h2{font-size:19px;margin:0}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:#cbd5df}.where,.when{color:var(--muted);font-size:14px}.features{font-size:13px;color:#cbd5df}.card a{color:var(--accent);text-decoration:none;margin-top:auto}.empty{padding:30px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
@media(max-width:640px){body{padding:16px}header{display:block}h1{font-size:26px}}
</style>
</head>
<body>
<header><div><h1>festivals</h1><p class="meta">祭り・フェス · 構造化データビュー</p></div><div id="status">loading...</div></header>
<div class="toolbar">
<input id="q" placeholder="祭り・地域・特徴を検索">
<select id="type"><option value="">すべて</option></select>
<select id="month"><option value="">月</option></select>
</div>
<main id="out"><div class="empty">loading...</div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const records=[];
function parse(text){return text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).flatMap(x=>{try{return [JSON.parse(x)]}catch{return []}})}
function place(x){const l=x.location||{};return [l.country,l.prefecture,l.city,l.area,l.state].filter(Boolean).join(' · ')}
function render(){
 const q=document.querySelector('#q').value.toLowerCase(), t=document.querySelector('#type').value, m=document.querySelector('#month').value;
 const rows=records.filter(x=>{const hay=JSON.stringify(x).toLowerCase();return (!q||hay.includes(q))&&(!t||x.type===t)&&(!m||(x.months||[]).includes(+m))});
 document.querySelector('#status').textContent=rows.length+'件';
 document.querySelector('#out').innerHTML=rows.length?'<div class="grid">'+rows.map(x=>`
 <article class="card"><h2>${esc(x.name)}</h2><div class="badges"><span class="badge">${esc(x.type||'festival')}</span>${(x.category||[]).map(v=>`<span class="badge">${esc(v)}</span>`).join('')}</div>
 <div class="where">${esc(place(x)||'地域未登録')}</div><div class="when">${(x.months||[]).length?'開催月: '+x.months.join(' / ')+'月':esc(x.recurrence||'')}</div>
 <div class="features">${esc((x.features||[]).join(' · '))}</div>${x.official_url?`<a href="${esc(x.official_url)}" target="_blank" rel="noopener">公式サイト ↗</a>`:''}</article>`).join('')+'</div>':'<div class="empty">該当する祭り・フェスがありません。</div>';
}
async function load(){
 const base=await (await fetch('data/festivals.jsonl')).text(); records.push(...parse(base));
 const now=new Date(), years=[now.getFullYear()-1,now.getFullYear(),now.getFullYear()+1];
 for(const y of years)for(let m=1;m<=12;m++){const key=y+'-'+String(m).padStart(2,'0');try{const r=await fetch('data/monthly/'+key+'.jsonl');if(r.ok)records.push(...parse(await r.text()))}catch{}}
 const types=[...new Set(records.map(x=>x.type).filter(Boolean))].sort();
 for(const v of types)document.querySelector('#type').insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`);
 for(let m=1;m<=12;m++)document.querySelector('#month').insertAdjacentHTML('beforeend',`<option value="${m}">${m}月</option>`);
 render();
}
document.addEventListener('DOMContentLoaded',()=>{
 ['q','type','month'].forEach(id=>document.querySelector('#'+id)?.addEventListener('input',render));
 load().catch(e=>{document.querySelector('#status').textContent='error';document.querySelector('#out').innerHTML='<div class="empty">'+esc(e.message)+'</div>'});
});
</script>
</body>
</html>
