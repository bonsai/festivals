<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>festivals — 祭り・フェス</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:24px;line-height:1.7;background:#111;color:#eee}
a{color:#9cf} pre{white-space:pre-wrap;word-break:break-word;font:14px/1.7 ui-monospace,monospace}
h1{margin-bottom:.2em} .meta{color:#aaa}
</style>
</head>
<body>
<h1>festivals</h1>
<p class="meta">祭り・フェス 月次データ / GitHub Pages</p>
<pre id="out">loading...</pre>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  const r=await fetch('data/festivals.jsonl');
  const base=await r.text();
  const files=[];
  for(let y=new Date().getFullYear()-1;y<=new Date().getFullYear()+1;y++)
    for(let m=1;m<=12;m++){
      const key=y+'-'+String(m).padStart(2,'0');
      try{const x=await fetch('data/monthly/'+key+'.jsonl');if(x.ok)files.push([key,await x.text()])}catch{}
    }
  document.querySelector('#out').innerHTML =
    '【festival master】\n'+esc(base.trim())+
    '\n\n【monthly crawl】\n'+
    (files.length?files.map(([k,v])=>'## '+k+'\n'+esc(v.trim())).join('\n\n'):'まだ月次データがありません');
}
load().catch(e=>document.querySelector('#out').textContent='load error: '+e);
</script>
</body>
</html>
