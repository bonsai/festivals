name: Update Monthly Festival Data

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Target month YYYY-MM (blank = current month)"
        required: false
        type: string
  schedule:
    - cron: "17 0 1 * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crawl festival sources
        env:
          TARGET_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import hashlib, html, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          now = datetime.now(timezone.utc)
          target = os.environ.get("TARGET_MONTH") or now.strftime("%Y-%m")
          if not re.fullmatch(r"\d{4}-\d{2}", target):
              raise SystemExit(f"invalid month: {target}")
          year, month = map(int, target.split("-"))
          if not 1 <= month <= 12:
              raise SystemExit(f"invalid month: {target}")

          domain_file = Path("data/domain.yaml")
          if not domain_file.exists():
              raise SystemExit("data/domain.yaml is required")

          urls = []
          for line in domain_file.read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if line.startswith("- url:"):
                  url = line.split(":", 1)[1].strip().strip('"').strip("'")
                  if url.startswith(("http://", "https://")):
                      urls.append(url)
          if not urls:
              raise SystemExit("no source URLs in data/domain.yaml")

          out = Path("data/monthly") / f"{target}.jsonl"
          out.parent.mkdir(parents=True, exist_ok=True)
          month_re = re.compile(
              rf"{year}年{month}月|{month}月|{year}[-/.]{month:02d}|"
              rf"{year}[-/.]{month}(?!\d)|\b{month:02d}/|\b{month}/", re.I
          )

          def fetch(url):
              req = Request(url, headers={"User-Agent": "bonsai-festivals-monthly-crawler/1.0"})
              with urlopen(req, timeout=20) as r:
                  return r.read().decode("utf-8", "ignore")

          def text(src):
              src = re.sub(r"(?is)<script.*?</script>|<style.*?</style>|<noscript.*?</noscript>", " ", src)
              src = re.sub(r"(?s)<[^>]+>", " ", src)
              return re.sub(r"\s+", " ", html.unescape(src)).strip()

          def links(src, base):
              found = []
              for href in re.findall(r'''href=["']([^"']+)["']''', src, re.I):
                  u = urljoin(base, href).split("#", 1)[0]
                  if urlparse(u).netloc == urlparse(base).netloc:
                      found.append(u)
              return list(dict.fromkeys(found))[:30]

          rows, seen = [], set()
          for source in urls:
              try:
                  home = fetch(source)
                  candidates = [source] + links(home, source)
              except Exception as e:
                  print(f"source failed: {source}: {e}")
                  continue
              for page in candidates:
                  try:
                      raw = home if page == source else fetch(page)
                  except Exception as e:
                      print(f"page failed: {page}: {e}")
                      continue
                  body = text(raw)
                  m = month_re.search(body)
                  if not m:
                      continue
                  key = hashlib.sha256(page.encode()).hexdigest()[:16]
                  if key in seen:
                      continue
                  seen.add(key)
                  tm = re.search(r"(?is)<title[^>]*>(.*?)</title>", raw)
                  title = text(tm.group(1)) if tm else ""
                  rows.append({
                      "id": f"{target}-{key}",
                      "month": target,
                      "name": title or urlparse(page).path.strip("/") or urlparse(page).netloc,
                      "type": "festival",
                      "official_url": page,
                      "source_url": source,
                      "month_evidence": m.group(0),
                      "snippet": body[max(0,m.start()-220):m.end()+320],
                      "crawled_at": now.isoformat()
                  })

          rows.sort(key=lambda x: (x["name"], x["official_url"]))
          out.write_text("".join(json.dumps(x, ensure_ascii=False)+"\n" for x in rows), encoding="utf-8")
          print(f"target={target} sources={len(urls)} records={len(rows)} output={out}")
          PY
      - name: Commit monthly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monthly/
          git diff --cached --quiet || git commit -m "data: update monthly festival data"
          git push
