name: Crawl October Festivals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crawl October festival sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          domains = Path("domain.yaml")
          print("domain.yaml:", domains.exists())
          print("October crawl placeholder: source domains will be read from domain.yaml")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: crawl October festivals"
          git push
